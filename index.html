<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossfade F1 · Share your race footage</title><meta name="robots" content="noindex">
<style>
:root{--black:#000;--white:#fafafa;--gray:#dcdcdc;--blue:#43a9fa}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:"aktiv-grotesk","Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:520px;margin:auto;padding:28px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;padding-bottom:16px}
header img{height:56px}.tag{font-size:.7em;letter-spacing:.2em;color:var(--blue);border:1px solid var(--blue);padding:4px 8px;border-radius:2px}
h1{font-size:2em;font-weight:700;letter-spacing:-.02em;margin:28px 0 6px}p.lead{color:var(--gray);line-height:1.5;margin:0 0 22px}
label{display:block;font-size:.75em;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);margin:18px 0 6px}
input,select{width:100%;font:inherit;font-size:1.05em;padding:14px;background:#111;color:var(--white);border:1px solid #333;border-radius:4px}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.pick{display:block;text-align:center;padding:26px 14px;border:1px dashed #444;border-radius:4px;color:var(--gray);cursor:pointer;text-transform:none;letter-spacing:0;font-size:1em}
.pick b{color:var(--white);display:block;font-size:1.1em;margin-bottom:4px}#files{display:none}
button{width:100%;margin-top:22px;padding:16px;font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--blue);color:#000;border:0;border-radius:4px}
button:disabled{opacity:.4}.f{background:#111;border:1px solid #222;border-radius:4px;padding:10px 12px;margin-top:8px;font-size:.9em}
.f small{color:#888;display:block;margin-top:2px}.bar{height:4px;background:#222;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.ok{color:var(--blue)}.err{color:#ff5a5a}#done{margin-top:20px;font-weight:700;color:var(--blue)}footer{margin-top:40px;font-size:.75em;color:#666;text-align:center}
</style></head><body><main>
<header><img src="assets/crossfade-logo-white.png" alt="Crossfade Design"><span class="tag">F1 UPLOADS</span></header>
<h1>Share your race footage.</h1>
<p class="lead">Send us the videos and photos you shot at the track, full quality straight from your phone. We'll cut them into the race-weekend edit. Keep this page open until every bar is full.</p>
<label for="name">Your name</label><input id="name" autocomplete="name" placeholder="First and last">
<label for="race">Race weekend</label><select id="race"><option>Loading races…</option></select>
<label class="pick" for="files"><b>Choose videos &amp; photos</b>Tap to pick from your camera roll. Big files are fine.</label>
<input id="files" type="file" multiple accept="video/*,image/*">
<div id="list"></div><button id="go" disabled>Upload</button><p id="done"></p>
<footer>A Crossfade Design tool · Files go privately to Crossfade's Drive.</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbw9HR1L6WdURqHsUBdWWMAscaZGeiRYGfxhowBDeebO83TUM7IGnEWeaaGBENAN_Hzg/exec"; // TODO: paste the Apps Script web app /exec URL here
const READY=API.startsWith("https://script.google.com/");
if(!READY)addEventListener("DOMContentLoaded",()=>{$("go").textContent="Uploads open soon";$("done").textContent="Uploads open soon. Check back shortly!";});
const CHUNK=8*1024*1024, MAX_BYTES=10*1024**3, MAX_FILES=50; let picked=[];
const $=id=>document.getElementById(id);
// Race calendar from Jolpica (Ergast successor). Default = most recent race weekend that has started.
(async()=>{try{const y=new Date().getFullYear();
 const r=(await (await fetch(`https://api.jolpi.ca/ergast/f1/${y}/races/?limit=40`)).json()).MRData.RaceTable.Races;
 const today=new Date().toISOString().slice(0,10);let def="";
 $("race").innerHTML='<option value="">Not sure / auto-detect</option>'+r.map(x=>{const s=(x.FirstPractice||{}).date||x.date;
  if(x.date<=today)def=x.round;return `<option value="${x.round}">${x.date.slice(5)} · ${x.raceName.replace(" Grand Prix"," GP")}</option>`}).join("");
 $("race").value=def;}catch(e){$("race").innerHTML='<option value="">Auto-detect from file dates</option>'}})();
// Capture date: EXIF/HEIC via exifr; MOV/MP4 via mvhd atom; else File.lastModified.
async function captureDate(f){
 try{if(f.type.startsWith("image/")){const d=await exifr.parse(f,["DateTimeOriginal","CreateDate"]);const t=d&&(d.DateTimeOriginal||d.CreateDate);if(t)return{t:new Date(t).toISOString(),src:"exif"}}
  else{for(const [a,b] of [[0,4<<20],[Math.max(0,f.size-(4<<20)),f.size]]){const u=new Uint8Array(await f.slice(a,b).arrayBuffer());
   for(let i=0;i<u.length-24;i++)if(u[i]==0x6d&&u[i+1]==0x76&&u[i+2]==0x68&&u[i+3]==0x64){const v=new DataView(u.buffer,i+4);
    const s=v.getUint8(0)==1?Number(v.getBigUint64(4)):v.getUint32(4);if(s>0)return{t:new Date((s-2082844800)*1000).toISOString(),src:"quicktime"}}}}}catch(e){}
 return{t:new Date(f.lastModified).toISOString(),src:"lastModified"}}
$("files").onchange=()=>{const all=[...$("files").files];picked=all.filter(f=>/^(image|video)\//.test(f.type)&&f.size>0&&f.size<=MAX_BYTES).slice(0,MAX_FILES);
 if(picked.length<all.length)alert(`Skipped ${all.length-picked.length} file(s): photos/videos only, up to 10 GB each, ${MAX_FILES} per visit.`);$("list").innerHTML="";
 picked.forEach(f=>{const d=document.createElement("div");d.className="f";d.innerHTML=`${f.name}<small>${(f.size/1048576).toFixed(1)} MB · ready</small><div class="bar"><i></i></div>`;f.el=d;$("list").append(d)});
 $("go").disabled=!picked.length||!READY};
$("go").onclick=async()=>{const n=$("name").value.trim();if(!n){$("name").focus();return alert("Please enter your name")}
 $("go").disabled=true;let good=0;
 for(const f of picked){const st=f.el.querySelector("small"),bar=f.el.querySelector("i");
  try{st.textContent="Reading date…";const cd=await captureDate(f);
   const r=await fetch(API,{method:"POST",body:JSON.stringify({name:n,file:f.name,type:f.type,size:f.size,captured:cd.t,dateSource:cd.src,lastModified:new Date(f.lastModified).toISOString(),race:$("race").value})});
   const j=await r.json();if(!j.url)throw j.error||"no session";
   for(let s=0;s<f.size;s+=CHUNK){const e=Math.min(s+CHUNK,f.size);let tries=0;
    while(true){try{const x=await fetch(j.url,{method:"PUT",headers:{"Content-Range":`bytes ${s}-${e-1}/${f.size}`},body:f.slice(s,e)});
     if(x.ok||x.status==308)break;throw x.status}catch(_){if(++tries>6)throw "network";await new Promise(z=>setTimeout(z,1500*tries))}}
    bar.style.width=(e/f.size*100)+"%";st.textContent=`${Math.round(e/f.size*100)}% · ${j.folder}`}
   st.innerHTML=`<span class="ok">✓ Uploaded</span> · ${j.folder}`;good++}
  catch(err){st.innerHTML='<span class="err">Upload failed. Tap Upload to retry.</span>';$("go").disabled=false}}
 $("done").textContent=good==picked.length?"Got it all. Thanks for shooting!":`${good} of ${picked.length} uploaded.`};
</script></body></html>
